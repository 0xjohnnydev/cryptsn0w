// Admit every APT payload on-device before dpkg unpacks it or invokes its
// maintainer scripts. Version 1 supplies one absolute archive path per line on
// stdin, which codex-runtime-trust-client validates through the fixed broker.
DPkg::Pre-Install-Pkgs {
    "/var/jb/usr/libexec/codex-runtime-trust-client";
};
DPkg::Tools::Options::/var/jb/usr/libexec/codex-runtime-trust-client::Version "1";
