// Rootless APT hardcodes /bin/sh for DPkg::Pre-Install-Pkgs, but iOS exposes
// the bootstrap shell only at /var/jb/bin/sh.  Running a hook here therefore
// exits through APT's own code 100 before the hook binary starts.  The Sileo
// root broker performs the equivalent mandatory archive validation directly
// after its bounded prefetch and before spawning this APT transaction.
Codex::SBInject::PackageValidator "/var/jb/usr/libexec/sbinject-package-validator";
Codex::SBInject::ValidationMode "broker-prefetch-pre-install-v2";
